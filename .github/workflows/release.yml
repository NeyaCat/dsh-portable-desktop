name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
        default: '0.1.2'
      dsh_version:
        description: DSH version
        required: true
        default: '0.2.0-rc.2'
      node_version:
        description: Node version
        required: true
        default: 'v24.19.0'
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve versions
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DSH: ${{ inputs.dsh_version }}
          INPUT_NODE: ${{ inputs.node_version }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME -replace '^v', '' }
          $dsh = if ($env:INPUT_DSH) { $env:INPUT_DSH } else { '0.2.0-rc.2' }
          $node = if ($env:INPUT_NODE) { $env:INPUT_NODE } else { 'v24.19.0' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "dsh=$dsh" >> $env:GITHUB_OUTPUT
          "node=$node" >> $env:GITHUB_OUTPUT
      - name: Build standard and full packages
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DSH: ${{ steps.version.outputs.dsh }}
          NODE: ${{ steps.version.outputs.node }}
        run: |
          $notes = "release-notes/$env:VERSION.md"
          $extra = @{}
          if (Test-Path -LiteralPath $notes) { $extra.ReleaseNotesFile = $notes }
          foreach ($flavor in @('standard', 'full')) {
            ./packaging/build-portable.ps1 -Version $env:VERSION -DshVersion $env:DSH -NodeVersion $env:NODE -Flavor $flavor @extra
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Portable-unsigned-${{ steps.version.outputs.version }}
          path: out/*.zip
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = @(Get-ChildItem out/*.zip | ForEach-Object FullName)
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME) + $assets + @('--title', "DSH Portable Desktop $env:GITHUB_REF_NAME")
          $notes = "release-notes/$env:VERSION.md"
          if (Test-Path -LiteralPath $notes) { $arguments += @('--notes-file', $notes) }
          else { $arguments += '--generate-notes' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
